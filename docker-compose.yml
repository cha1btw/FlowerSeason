services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: flowerseason
      POSTGRES_PASSWORD: flowerseason
      POSTGRES_DB: flowerseason
    ports:
      - "5433:5432"
    volumes:
      - flowerseason-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowerseason -d flowerseason"]
      interval: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://flowerseason:flowerseason@db:5432/flowerseason
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  flowerseason-pgdata:
